<div class="admin-layout">
  <nav class="admin-sidebar" [class.admin-sidebar-open]="isSidenavOpen | async" aria-label="Admin sections" data-testid="admin-nav">
    <div class="sidebar-header">
      <a routerLink="/admin" class="logo-link">
        <h1>Admin</h1>
      </a>
    </div>
    @for (group of navGroups; track group.name) {
      <div class="sidebar-group" [attr.data-testid]="'admin-nav-group-' + group.name.toLowerCase()">
        <p class="sidebar-group-label">{{ group.name }}</p>
        <ul class="sidebar-nav">
          @for (item of group.items; track item.key) {
            <li>
              <a [routerLink]="item.path" [attr.data-testid]="'admin-nav-link-' + item.key" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeSidenav()">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
    <div class="sidebar-footer">
      <span class="version">v{{ version }}</span>
    </div>
  </nav>

  @if (isSidenavOpen | async) {
    <div class="admin-sidebar-backdrop" (click)="closeSidenav()"></div>
  }

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
