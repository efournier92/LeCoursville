@if (user?.roles?.admin || user?.roles?.super) {
  <mat-card class="admin-surface admin-media-upload-form-container">
    @if (deleteError) {
      <div class="admin-error" role="alert">{{ deleteError }}</div>
    }
    <form class="admin-media-upload-upload-form">
      <mat-form-field class="admin-upload-input">
        <mat-label>Title</mat-label>
        <input
          type="text"
          matInput
          name="videoTitle"
          [(ngModel)]="video.title"
          />
      </mat-form-field>
      <mat-form-field class="admin-upload-input">
        <mat-label>File Name</mat-label>
        <input
          type="text"
          matInput
          name="videoFileName"
          [(ngModel)]="video.fileName"
          />
      </mat-form-field>
      <mat-form-field class="admin-upload-input">
        <mat-label>Date</mat-label>
        <input
          type="text"
          matInput
          name="videoDate"
          [(ngModel)]="video.date"
          />
      </mat-form-field>
      <mat-form-field class="admin-upload-input">
        <mat-label>ID</mat-label>
        <input
          type="text"
          matInput
          name="videoId"
          [(ngModel)]="video.id"
          />
      </mat-form-field>
      <mat-checkbox
        class="admin-upload-checkbox"
        name="isSticky"
        [(ngModel)]="video.isSticky"
        >Is Sticky?</mat-checkbox
        >
      <mat-checkbox
        class="admin-upload-checkbox"
        name="isHidden"
        [(ngModel)]="video.isHidden"
        >Should Hide from Lists?</mat-checkbox
        >
      @if (formError) {
        <div class="admin-error" role="alert" data-testid="video-upload-error">{{ formError }}</div>
      }
      @if (uploadSuccess) {
        <div class="admin-success" role="status" data-testid="video-upload-success">{{ uploadSuccess }}</div>
      }
      <div class="admin-form-actions">
        <button
          mat-flat-button
          color="primary"
          class="admin-form-action-button admin-form-action-button-upload"
          [disabled]="uploading"
          (click)="onUploadSelectedMedia()"
          >
          @if (uploading) {
            <span>Uploading…</span>
          }
          @if (!uploading && !video.id) {
            <span>Upload</span>
          }
          @if (!uploading && video.id) {
            <span>Update</span>
          }
        </button>
        <button
          mat-stroked-button
          class="admin-form-action-button admin-form-action-button-cancel"
          [disabled]="uploading"
          (click)="onCancelSelectedMedia(video)"
          >
          Clear
        </button>
        @if (video.id) {
          <button
            mat-stroked-button
            class="admin-form-action-button admin-form-action-button-delete"
            (click)="onDeleteSelectedMedia(video)"
            >
            Delete
          </button>
        }
      </div>
    </form>
  </mat-card>
  <div class="admin-media-list-container">
    <app-media-list
      [mediaTypesToShow]="getVideoTypeId()"
      [isAdminMode]="true"
      (mediaClickEvent)="onMediaSelect($event)"
      >
    </app-media-list>
  </div>
}
