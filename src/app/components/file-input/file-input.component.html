<div class="file-input-container d-flex align-items-end">
  <div class="file-input">
    <label
      class="file-input-label mdl-button mdl-js-button mdl-button--fab mdl-button--mini-fab mdl-js-ripple-effect"
      (change)="onInputChange()"
      >
      <i class="material-icons">{{ matIcon }}</i>
      <input
        id="file-input-file"
        class="none"
        type="file"
        [multiple]="shouldAllowMultipleFiles"
        />
    </label>
  </div>

  @if (shouldShowLabel) {
    <div>
      <div
        id="file-input-text-container"
        class="mdl-textfield mdl-js-textfield"
        >
        <input
          id="file-input-text"
          class="mdl-textfield__input"
          type="text"
          placeholder="{{ inputPlaceholder }}"
          accept=".png,.jpg"
          disabled
          readonly
          />
      </div>
    </div>
  }

  @if (shouldShowClearButton) {
    <div>
      @if (shouldAllowCancel()) {
        <mat-icon
          class="file-upload-cancel-icon"
          (click)="clearInput()"
          >cancel</mat-icon
          >
        }
      </div>
    }
  </div>
