<div class="audio-player-container">
  <div class="d-flex justify-content-center align-items-center flex-column w-100">
    <div *ngIf="!album?.urls?.icon" class="album-name-container">
      {{ album.title }}
    </div>
    <div *ngIf="album?.id && !album?.urls?.icon && album?.artist" class="artist-name-container">
      {{ album.artist }}
    </div>
    <div class="d-flex justify-content-center" style="text-align: center">
      <div class="audio-player-album-art-container col-md-7">
        <img
          class="audio-player-album-art"
          [src]="album?.urls?.icon"
          [alt]="album?.title"
        />
      </div>
    </div>
  </div>

  <div class="audio-player-native" *ngIf="tracks.length > 0">
    <div class="audio-player-now-playing">
      <span class="audio-player-track-title">{{ currentTrack?.title || album.title }}</span>
      <span class="audio-player-track-artist">{{ currentTrack?.artist || album.artist }}</span>
    </div>
    <audio #nativeAudio
           class="audio-player-element"
           [src]="currentTrack?.url"
           controls
           autoplay
           preload="metadata"></audio>
    <ul class="audio-player-tracklist">
      <li *ngFor="let track of tracks; let i = index">
        <button
          type="button"
          class="audio-player-track"
          [class.active]="track === currentTrack"
          (click)="selectTrack(track)"
        >
          <mat-icon aria-hidden="true">{{ track === currentTrack ? 'volume_up' : 'music_note' }}</mat-icon>
          <span class="audio-player-track-name">{{ track.title || ('Track ' + (i + 1)) }}</span>
          <span class="audio-player-track-artist">{{ track.artist }}</span>
        </button>
      </li>
    </ul>
  </div>

  <div *ngIf="tracks.length === 0" class="audio-player-empty">
    No tracks in this album
  </div>
</div>
