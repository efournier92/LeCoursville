<h2 mat-dialog-title>{{ data.album ? 'Edit Album' : 'New Album' }}</h2>
<mat-dialog-content>
  <mat-form-field class="album-edit-field">
    <mat-label>Album title</mat-label>
    <input matInput [(ngModel)]="title" required maxlength="80" [disabled]="saving" />
  </mat-form-field>
  @if (error) {
    <p class="album-edit-error" role="alert">{{ error }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [disabled]="saving" (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!title.trim() || saving" (click)="onSave()">
    {{ data.album ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
