<div class="d-flex justify-content-center">
  <div class="video-iframe-container w-100">
    @if (videoErrorMessage) {
      <p class="video-error" role="alert">{{ videoErrorMessage }}</p>
    } @else {
      <iframe
        class="video-iframe"
        [src]="videoUrl"
        [attr.title]="video?.title || 'Video player'"
        width="100%"
        height="100%"
        allow="autoplay"
        allowfullscreen="allowfullscreen"
      >
      </iframe>
    }
  </div>
</div>
