@if (user?.roles?.admin || user?.roles?.super) {
  <mat-card class="admin-surface admin-media-upload-form-container">
    @if (deleteError) {
      <div class="admin-error" role="alert">{{ deleteError }}</div>
    }
    <form class="audio-album-upload-form">
      <mat-form-field class="admin-upload-input">
        <mat-label>Title</mat-label>
        <input
          type="text"
          matInput
          name="albumTitle"
          [(ngModel)]="album.title"
          />
      </mat-form-field>
      <mat-form-field class="admin-upload-input">
        <mat-label>Folder Name</mat-label>
        <input
          type="text"
          matInput
          name="albumFolderName"
          [(ngModel)]="album.folderName"
          />
      </mat-form-field>
      @if (!isAlbumAlreadyUploaded()) {
        <mat-form-field
          class="admin-upload-input"
          >
          <mat-label>Tracks</mat-label>
          <textarea
            matInput
            name="albumTracks"
            [(ngModel)]="tracksString"
            cdkTextareaAutosize
            #autosize="cdkTextareaAutosize"
            cdkAutosizeMinRows="1"
            cdkAutosizeMaxRows="20"
          ></textarea>
        </mat-form-field>
      }
      <mat-checkbox
        class="admin-upload-checkbox"
        name="isSticky"
        [(ngModel)]="album.isSticky"
        >Is Sticky?</mat-checkbox
        >
      <mat-checkbox
        class="admin-upload-checkbox"
        name="isHidden"
        [(ngModel)]="album.isHidden"
        >Should Hide from Lists?</mat-checkbox
        >
      <div class="admin-form-actions">
        <button
          mat-flat-button
          color="primary"
          class="admin-form-action-button admin-form-action-button-upload"
          (click)="onUploadSelectedMedia()"
          >
          @if (!isAlbumAlreadyUploaded()) {
            <span>Upload</span>
          }
          @if (isAlbumAlreadyUploaded()) {
            <span>Update</span>
          }
        </button>
        <button
          mat-stroked-button
          class="admin-form-action-button admin-form-action-button-cancel"
          (click)="onCancelSelectedMedia(album)"
          >
          Clear
        </button>
        @if (album.id) {
          <button
            mat-stroked-button
            class="admin-form-action-button admin-form-action-button-delete"
            (click)="onDeleteSelectedMedia(album)"
            >
            Delete
          </button>
        }
      </div>
    </form>
  </mat-card>
  <div class="admin-media-list-container">
    @if (isUserAdmin()) {
      <app-media-list
        [mediaTypesToShow]="getAudioAlbumTypeId()"
        [isAdminMode]="true"
        (mediaClickEvent)="onMediaSelect($event)"
        >
      </app-media-list>
    }
  </div>
}
