<div class="auth-page">
  @if (awaitingSession) {
    <div class="auth-card auth-card--interstitial" data-testid="session-interstitial" aria-busy="true">
      <img
        class="auth-logo"
        src="./assets/img/logo/L.png"
        alt="LeCoursville"
      />
      <div class="session-interstitial-bar" aria-hidden="true"></div>
    </div>
  } @else if (!user?.id) {
    <div class="auth-card auth-card--login">
      <img
        class="auth-logo"
        src="./assets/img/logo/L.png"
        alt="LeCoursville"
      />
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Welcome back to LeCoursville</p>
      <form (ngSubmit)="onSignIn()" novalidate>
        <mat-form-field appearance="outline" class="auth-field">
          <mat-icon matPrefix aria-hidden="true">person</mat-icon>
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email"
            autocomplete="email" required data-testid="auth-email" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="auth-field">
          <mat-icon matPrefix aria-hidden="true">lock</mat-icon>
          <mat-label>Password</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="password"
            autocomplete="current-password" required data-testid="auth-password" />
        </mat-form-field>
        @if (error) {
          <div class="auth-banner auth-banner--error" role="alert" data-testid="auth-error">
            <mat-icon aria-hidden="true">error_outline</mat-icon>
            <span>{{ error }}</span>
          </div>
        }
        @if (info) {
          <div class="auth-banner auth-banner--info" role="status">
            <mat-icon aria-hidden="true">check_circle_outline</mat-icon>
            <span>{{ info }}</span>
          </div>
        }
        <button mat-flat-button color="primary" type="submit"
          class="auth-submit" [disabled]="loading" data-testid="auth-submit">
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
        <button mat-button type="button" class="auth-reset"
          (click)="onForgotPassword()">
          Forgot password?
        </button>
      </form>
    </div>
  } @else {
    <div class="auth-card auth-card--account">
      @if (!isEditMode) {
        <app-user-view
          [userOnCard]="user"
          (editClickedEvent)="onEdit()"
        ></app-user-view>
      }
      @if (isEditMode) {
        <app-user-edit
          [userOnCard]="user"
          [isAdminMode]="false"
          (cancelEditClickedEvent)="onCancelEdit()"
        ></app-user-edit>
      }
      <div class="auth-signout-row">
        <button mat-stroked-button color="warn" type="button"
          class="auth-signout" (click)="onSignOutButtonClick()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span>Sign out</span>
        </button>
      </div>
    </div>
  }
</div>
