<div class="auth-component-container">
  <div class="auth-container">
    @if (!user?.id) {
      <div class="auth-signin-card">
        <img
          class="auth-signin-logo"
          src="./assets/img/logo/L.png"
          alt="LeCoursville"
          />
        <h1 class="auth-signin-title">Sign in</h1>
        <p class="auth-signin-subtitle">Welcome back to LeCoursville</p>
        <form (ngSubmit)="onSignIn()" novalidate>
          <mat-form-field appearance="fill" class="auth-field">
            <mat-label>Email</mat-label>
            <input matInput type="email" name="email" [(ngModel)]="email"
              autocomplete="email" required />
          </mat-form-field>
          <mat-form-field appearance="fill" class="auth-field">
            <mat-label>Password</mat-label>
            <input matInput type="password" name="password" [(ngModel)]="password"
              autocomplete="current-password" required />
          </mat-form-field>
          @if (error) {
            <div class="auth-error">{{ error }}</div>
          }
          @if (info) {
            <div class="auth-info">{{ info }}</div>
          }
          <button mat-raised-button color="primary" type="submit"
            class="auth-submit" [disabled]="loading">
            {{ loading ? 'Signing in…' : 'Sign in' }}
          </button>
          <button mat-button type="button" class="auth-reset"
            (click)="onForgotPassword()">
            Forgot password?
          </button>
        </form>
      </div>
    }

    <div class="d-flex flex-column justify-content-center align-items-center">
      @if (user?.id) {
        <div
          class="col-12 col-sm-8 col-lg-5 mt-3"
          >
          @if (!isEditMode) {
            <app-user-view
              [userOnCard]="user"
              (editClickedEvent)="onEdit()"
            ></app-user-view>
          }
          @if (isEditMode) {
            <app-user-edit
              [userOnCard]="user"
              [isAdminMode]="false"
              (cancelEditClickedEvent)="onCancelEdit()"
              >
            </app-user-edit>
          }
          <button
            mat-raised-button
            color="warn"
            class="w-100 mt-3"
            (click)="onSignOutButtonClick()"
            >
            Sign out
          </button>
        </div>
      }
    </div>
  </div>

  <div class="row justify-content-center">
    <img
      class="auth-image unselectable col-xs-10 col-sm-8 col-md-6 col-lg-6 col-xl-4"
      src="./assets/img/logo/LeCours_Logo_Inward_Black.png"
      />
  </div>
</div>
