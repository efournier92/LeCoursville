<div class="video-player-container">
  <video
    *ngIf="currentVideo?.urls?.download"
    class="video-player-native"
    #nativeVideo
    [src]="currentVideo.urls.download"
    controls
    preload="metadata"
  ></video>
  <p *ngIf="!currentVideo?.urls?.download" class="video-player-empty">No video available</p>
</div>
