<div class="video-player-container">
  @if (currentVideo?.urls?.download) {
    <video
      class="video-player-native"
      #nativeVideo
      [src]="currentVideo.urls.download"
      controls
      preload="metadata"
    ></video>
  }
  @if (!currentVideo?.urls?.download) {
    <p class="video-player-empty">No video available</p>
  }
</div>
