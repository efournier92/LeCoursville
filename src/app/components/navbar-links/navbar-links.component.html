@if (!flagsReady) {
  <div
    class="nav-skeleton"
    data-testid="nav-flags-skeleton"
    aria-hidden="true"
    >
    <div class="nav-skeleton-item">
      <div class="nav-skeleton-icon"></div>
      <div class="nav-skeleton-label"></div>
    </div>
  </div>
}

@if (flagsReady && !isMenuList) {
  <div
    id="lecoursville-navbar-links"
    class="toolbar-routes-buttons-inline"
    >
    @for (button of filteredButtons; track button) {
      <button
        mat-button
        [routerLink]="button.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: button.link === '/'}"
        >
        <mat-icon class="navbar-link-icon">{{ button.icon }}</mat-icon>
        <span><span class="first-char">{{ button.title.charAt(0) }}</span>{{ button.title.slice(1) }}</span>
      </button>
    }
  </div>
}

@if (flagsReady && isMenuList) {
  <div
    class="toolbar-routes-buttons-inline"
    >
    @for (button of filteredButtons; track button) {
      <button
        mat-menu-item
        [routerLink]="button.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: button.link === '/'}"
        >
        <mat-icon class="navbar-link-icon">{{ button.icon }}</mat-icon>
        <span><span class="first-char">{{ button.title.charAt(0) }}</span>{{ button.title.slice(1) }}</span>
      </button>
    }
  </div>
}
