@if (day) {
  <section class="day-agenda" aria-live="polite">
    <h2 class="day-agenda-heading">{{ day | date : 'EEEE, MMMM d' }}</h2>
    @if (events.length) {
      <ul class="day-agenda-list">
        @for (event of events; track event.id) {
          <li class="day-agenda-item">
            <span class="day-agenda-marker" [ngClass]="typeClass(event)" aria-hidden="true"></span>
            <span class="day-agenda-title">{{ event.title }}</span>
            <span class="day-agenda-type">{{ typeLabel(event) }}</span>
          </li>
        }
      </ul>
    } @else {
      <p class="day-agenda-empty">No events</p>
    }
  </section>
}
