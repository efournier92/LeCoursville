<div class="chat-component page-ground page-content">
  <app-page-toolbar title="Chat">
    <button mat-flat-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      <span>New Message</span>
    </button>
  </app-page-toolbar>
  <div class="chat-container d-flex justify-content-center row">
    @if (!loading && allItems.length === 0) {
      <div class="chat-empty">
        <mat-icon class="chat-empty-icon" aria-hidden="true">forum</mat-icon>
        <p class="chat-empty-title">No messages yet</p>
        <p class="chat-empty-hint">Start the conversation — the family's listening.</p>
        <button mat-flat-button color="primary" (click)="onCreate()">
          <mat-icon>add</mat-icon>
          <span>New Message</span>
        </button>
      </div>
    }
    @for (message of allItems; track message) {
      <mat-card
        class="message-card-container mt-4 col-lg-11 col-xl-7"
        >
        @if (!message.isEditable) {
          <app-chat-view
            [message]="message"
            [parent]="message"
            (updateParentEvent)="updateMessages($event)"
            (cancelEditEvent)="cancelEdit($event)"
          ></app-chat-view>
        }
        @if (message.isEditable) {
          <app-chat-edit
            [message]="message"
            [parent]="message"
            (updateParentEvent)="updateMessages($event)"
            (cancelEditEvent)="cancelEdit($event)"
          ></app-chat-edit>
        }
      </mat-card>
    }
  </div>
</div>
