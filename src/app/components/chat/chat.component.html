<div class="chat-component page-ground page-content">
  <!-- Compact heading row instead of a page-toolbar card: the title and the
       create action share one 44px line so messages start near the top. -->
  <div class="chat-heading">
    <h1 class="chat-heading-title">Chat</h1>
    <button
      mat-flat-button
      color="primary"
      class="chat-heading-action"
      type="button"
      (click)="onCreate()"
      >
      <mat-icon>add</mat-icon>
      <span>New Message</span>
    </button>
  </div>
  <div class="chat-container d-flex justify-content-center row">
    @if (error) {
      <div class="col-lg-11 col-xl-7 mt-4">
        <app-load-error message="We couldn't load messages." (retry)="retry()"></app-load-error>
      </div>
    }
    @if (!loading && !error && allItems.length === 0) {
      <div class="chat-empty">
        <mat-icon class="chat-empty-icon" aria-hidden="true">forum</mat-icon>
        <p class="chat-empty-title">We couldn't find any messages.</p>
        <p class="chat-empty-hint">Start the conversation.</p>
        <button mat-flat-button color="primary" (click)="onCreate()">
          <mat-icon>add</mat-icon>
          <span>New Message</span>
        </button>
      </div>
    }
    @for (message of allItems; track message) {
      <mat-card
        class="message-card-container col-lg-11 col-xl-7"
        >
        @if (!message.isEditable) {
          <app-chat-view
            [message]="message"
            [parent]="message"
            [rootId]="message.id"
            (updateParentEvent)="updateMessages($event)"
            (cancelEditEvent)="cancelEdit($event)"
          ></app-chat-view>
        }
        @if (message.isEditable) {
          <app-chat-edit
            [message]="message"
            [parent]="message"
            [rootId]="message.id"
            (updateParentEvent)="updateMessages($event)"
            (cancelEditEvent)="cancelEdit($event)"
          ></app-chat-edit>
        }
      </mat-card>
    }
  </div>
</div>
