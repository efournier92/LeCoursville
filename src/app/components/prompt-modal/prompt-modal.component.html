<div class="prompt-modal-container d-flex flex-column align-items-center">
  <h1
    mat-dialog-title
    class="prompt-modal-title"
    >
    {{ data.header }}
  </h1>
  <div mat-dialog-content>
    <p class="prompt-modal-message">
      {{ data.message }}
    </p>
  </div>
  <div
    class="w-100 d-flex justify-content-around row"
    mat-dialog-actions
    >
    @for (button of buttons; track button) {
      <button
        mat-flat-button
        class="col"
        color="{{ button.color }}"
        [class.btn-destructive]="button.destructive"
        (click)="onActionClick(button.isConfirmAction)"
        >
        @if (button.destructive) {
          <mat-icon aria-hidden="true">warning</mat-icon>
        }
        {{ button.label }}
      </button>
    }
  </div>
</div>
