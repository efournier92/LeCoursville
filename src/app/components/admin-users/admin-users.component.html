<div class="admin-users-component-container">

  <app-page-toolbar title="Users">
    <mat-form-field class="filter-users-form-field">
      <mat-label>Filter</mat-label>
      <input
        matInput
        type="text"
        data-testid="admin-users-filter"
        [(ngModel)]="sortSettings.activeFilterQuery"
        (input)="onFilterQueryChange($event.target.value)"
        />
      @if (sortSettings.activeFilterQuery) {
        <button
          matSuffix
          mat-icon-button
          aria-label="Clear filter"
          (click)="onFilterQueryChange('')"
          >
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>

    <div class="admin-users-sort-buttons">
      <button
        mat-button
        [matMenuTriggerFor]="menu"
        >
        Sort By: {{ getSortPropertyText() }}
      </button>
      <button
        mat-button
        aria-label="Reverse sort direction"
        (click)="reverseDisplayedUsersSortOrder()"
        >
        @if (!isSortDescending()) {
          <mat-icon>arrow_drop_up</mat-icon>
        }
        @if (isSortDescending()) {
          <mat-icon>arrow_drop_down</mat-icon>
        }
      </button>
    </div>
    <mat-menu #menu="matMenu">
      <button
        mat-menu-item
        (click)="sortByDateLastActive()"
        >
        Date Last Active
      </button>
      <button
        mat-menu-item
        (click)="sortByName()"
        >
        Name
      </button>
      <button
        mat-menu-item
        (click)="sortByEmail()"
        >
        Email
      </button>
      <button
        mat-menu-item
        (click)="sortByDateRegistered()"
        >
        Date Registered
      </button>
    </mat-menu>
  </app-page-toolbar>

  @if (state === 'loading') {
    <div class="admin-skeleton-rows" aria-busy="true" aria-label="Loading users">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  }

  @if (state === 'error') {
    <app-load-error
      message="We couldn't load the user list."
      (retry)="retry()"
      />
  }

  @if (state === 'ready') {
    @if (filteredTotal === 0) {
      <app-no-results-message
        [searchTerm]="sortSettings.activeFilterQuery"
        noun="users"
        title="No users found"
        hint="Users will appear here once they sign in."
        />
    } @else {
      <div class="admin-user-card-container">
        @for (cardUser of displayedUsers; track cardUser.id) {
          <app-user-edit
            [userOnCard]="cardUser"
            [isAdminMode]="true"
            (cancelEditClickedEvent)="updateUser(cardUser)"
            >
          </app-user-edit>
        }
      </div>

      <div class="admin-pagination">
        <span>{{ showingRange }}</span>
        <div class="pager admin-pager">
          <button
            mat-button
            type="button"
            [disabled]="pageIndex <= 1"
            (click)="previousPage()"
            >
            Prev
          </button>
          <button
            mat-button
            type="button"
            [disabled]="pageIndex >= pageCount"
            (click)="nextPage()"
            >
            Next
          </button>
        </div>
      </div>
    }
  }
</div>
