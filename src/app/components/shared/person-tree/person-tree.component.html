<ng-template #nodeTemplate let-nodes="nodes" let-level="level">
  @for (node of nodes; track node) {
    @let spouseName = getSpouseName(node);
    @let nodeChildren = getNodeChildren(node);
    <div class="tree-row">
      <span class="person-info">
        <span class="person-name clickable"
          [class.selected]="selectedPersonId === node.person.id"
          [class.deceased]="isPersonDeceased(node)"
          [attr.role]="clickable ? 'button' : null"
          [attr.tabindex]="clickable ? 0 : null"
          [attr.aria-pressed]="clickable && selectedPersonId ? selectedPersonId === node.person.id : null"
          (click)="onNodeClick(node)"
          (keydown)="onNodeKeydown($event, node)">
          {{ getPersonName(node) }}
        </span>
        @if (spouseName) {
          <span class="spouse-separator"> &amp; </span>
        }
        @if (spouseName) {
          <span class="person-name clickable"
            [class.selected]="selectedPersonId === node.spouse?.id"
            [class.deceased]="isSpouseDeceased(node)"
            [attr.role]="clickable ? 'button' : null"
            [attr.tabindex]="clickable ? 0 : null"
            [attr.aria-pressed]="clickable && selectedPersonId ? selectedPersonId === node.spouse?.id : null"
            (click)="onSpouseClick(node)"
            (keydown)="onSpouseKeydown($event, node)">
            {{ spouseName }}
          </span>
        }
      </span>
    </div>
    @if (hasChildren(node) && nodeChildren?.length) {
      <div class="children-container">
        <div class="generation-bar" [style.background-color]="getGenerationColor(node)"></div>
        <div class="children-items">
          <ng-template [ngTemplateOutlet]="nodeTemplate" [ngTemplateOutletContext]="{ nodes: nodeChildren, level: level + 1 }"></ng-template>
        </div>
      </div>
    }
  }
</ng-template>

<ng-template [ngTemplateOutlet]="nodeTemplate" [ngTemplateOutletContext]="{ nodes: nodes, level: 0 }"></ng-template>
