<div class="page-ground family-archive-page">
  <div class="page-content">
    @if (loading) {
      <div class="surface-card family-skeleton" data-testid="family-skeleton" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    } @else if (!available) {
      <div class="surface-card family-empty" data-testid="family-archive-empty">
        <p>This family archive is not available</p>
      </div>
    } @else {
      <div class="surface-card family-toolbar">
        <h1 class="family-title">{{ archive?.title }}</h1>
        <input
          class="family-search"
          type="search"
          placeholder="Search names"
          aria-label="Search names"
          data-testid="family-search"
          [(ngModel)]="searchText" />
      </div>
      <div class="family-layout">
        <app-family-chart
          class="family-chart-host"
          [people]="people"
          [search]="searchText"
          [selectedId]="selectedId"
          (select)="select($event)">
        </app-family-chart>
        <app-family-panel
          class="family-panel-host"
          [person]="selected"
          [people]="archive?.people || null"
          (select)="select($event)">
        </app-family-panel>
      </div>
    }
  </div>
</div>
