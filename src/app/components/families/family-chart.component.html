<div class="family-chart" data-testid="family-chart">
  @for (branch of visibleBranches(); track branch.root.id; let bi = $index) {
    <section class="family-branch" [attr.data-testid]="'family-branch-' + branch.root.id">
      @for (row of branch.generations; track $index) {
        @if (rowVisible(row)) {
          <div class="family-row">
            @for (person of row; track person.id) {
              @if (matches(person)) {
                <button
                  type="button"
                  class="family-unit"
                  [class.family-unit-selected]="person.id === selectedId"
                  [attr.data-testid]="'family-unit-' + person.id"
                  [attr.aria-pressed]="person.id === selectedId"
                  (click)="onSelect(person)"
                  (mouseenter)="onHoverStart(person)"
                  (mouseleave)="onHoverEnd()"
                  (keydown)="onKeydown($event, bi, person)">
                  <span class="family-unit-name">{{ personName(person) }}</span>
                  <span class="family-unit-years">
                    {{ person.birthDate || '' }}{{ person.birthDate || person.deathDate ? '–' : '' }}{{ person.deathDate || '' }}
                  </span>
                  @if (hoverId === person.id) {
                    <span class="family-unit-hover" data-testid="family-unit-hover">
                      {{ person.birthPlace || '' }}{{ person.occupation ? ' · ' + person.occupation : '' }}
                    </span>
                  }
                </button>
              }
            }
          </div>
        }
      }
    </section>
  } @empty {
    <p class="family-no-match">No matching family members.</p>
  }
</div>
